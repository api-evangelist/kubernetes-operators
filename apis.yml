apis:
- aid: kubernetes-operators:kubernetes-operators
  name: Kubernetes Operators
  description: >-
    Kubernetes Operators extend the Kubernetes API for managing complex stateful applications using custom
    resources and controllers. An Operator encodes the operational knowledge of a domain expert into software
    that automates the deployment, scaling, and management of Kubernetes applications.
  humanURL: https://kubernetes.io/docs/concepts/extend-kubernetes/operator/
  tags:
  - Automation
  - Cloud-Native
  - Custom Resources
  - Kubernetes
  tags_raw:
  - Automation
  - Cloud Native
  - Custom Resources
  - Kubernetes
  properties:
