    url: https://kubernetes.io/docs/reference/kubernetes-api/extend-resources/
  - type: AsyncAPI
    url: asyncapi/kubernetes-operators-watch-asyncapi.yml
- aid: kubernetes-operators:operator-sdk
  name: Operator SDK
  description: >-
    The Operator SDK is a framework for building Kubernetes Operators in Go, Ansible, or Helm. It provides
    high-level APIs, abstractions, scaffolding tools, and CLI commands that simplify writing operator
    logic and integrating with the Operator Lifecycle Manager (OLM) for packaging and distribution.
  humanURL: https://sdk.operatorframework.io/
  tags:
  - Go
  - Kubernetes
  - Operators
  - SDK
  properties:
  - type: Documentation
    url: https://sdk.operatorframework.io/docs/overview/
  - type: GettingStarted
    url: https://sdk.operatorframework.io/docs/building-operators/golang/tutorial/
  - type: GitHubRepository
    url: https://github.com/operator-framework/operator-sdk
- aid: kubernetes-operators:operatorhub
  name: OperatorHub
  description: >-
    OperatorHub.io is a community registry of Kubernetes Operators that can be discovered and installed
    via the Operator Lifecycle Manager. It provides a catalog of operators across categories including
    databases, monitoring, security, and networking for use in Kubernetes clusters.
  humanURL: https://operatorhub.io/
  tags:
  - Community
  - Kubernetes
  - Operators
  - Registry
  properties:
  - type: Documentation
    url: https://operatorhub.io/
- aid: kubernetes-operators:controller-runtime
  name: Controller-Runtime
  description: >-
    controller-runtime is a set of Go libraries for building Kubernetes controllers and operators. It
    is used by both Kubebuilder and Operator SDK and provides core abstractions including Manager, Client,
    Cache, and Reconciler interfaces for building controllers that interact with the Kubernetes API.
  humanURL: https://github.com/kubernetes-sigs/controller-runtime
  tags:
  - Controllers
  - Go
  - Kubernetes
  - SDK
  properties:
  - type: Documentation
    url: https://pkg.go.dev/sigs.k8s.io/controller-runtime
  - type: GitHubRepository
    url: https://github.com/kubernetes-sigs/controller-runtime
